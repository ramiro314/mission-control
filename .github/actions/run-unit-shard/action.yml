name: Run unit shard
description: Restore one Node dependency tree and run one complete unit shard, then rerun its failed test files once. Build and smoke run once per Node release in the build-smoke jobs, not here.

inputs:
  node-version:
    description: Node.js major version used by this shard.
    required: true
  shard:
    description: One-based shard index.
    required: true
  shard-total:
    description: Total number of unit shards.
    required: true

runs:
  using: composite
  steps:
    - name: Set up Node ${{ inputs.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}

    - name: Restore node_modules
      uses: actions/cache/restore@v5
      with:
        path: node_modules
        key: dependencies-${{ runner.os }}-${{ runner.arch }}-node-${{ inputs.node-version }}-${{ hashFiles('package-lock.json') }}
        fail-on-cache-miss: true

    # Keyed on the version the lockfile actually installed rather than the range in
    # package.json, because the cache holds one exact binary. `runner.arch` is in the key
    # for the reason the Playwright cache uses it: an x64 artifact must never restore onto
    # another architecture.
    - name: Resolve Electron version
      id: electron
      shell: bash
      run: echo "v=$(node -p "require('./node_modules/electron/package.json').version")" >> "$GITHUB_OUTPUT"

    # Deliberately not keyed on the Node version, so both supported releases share one
    # Electron runtime cache.
    - name: Cache the Electron runtime
      uses: actions/cache@v5
      with:
        path: ~/.cache/electron
        key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.electron.outputs.v }}

    # Electron 42+ downloads its runtime on first use instead of during npm install.
    # Provision it explicitly so GUI fixtures only exercise the application under test.
    # The cache removes the normal network dependency; retries protect its cold path.
    - name: Install Electron test runtime
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if npm exec -- install-electron --no; then exit 0; fi
          echo "::warning::Electron runtime download failed (attempt ${attempt}/3)"
          sleep $((attempt * 10))
        done
        exit 1

    # Source-loaded daemon tests acquire the same native state lock as the shipped daemon.
    # Build it before each shard runs so no test depends on another shard's module-load side effect.
    - name: Build native state lock
      shell: bash
      run: npm run build:state-lock-native

    # The shard records its exit code instead of failing here: the flake report step below
    # decides. It reruns only the failed files once, so a test that fails and then passes is a
    # flake (reported, job stays green) and one that fails twice fails the job. See
    # docs/flaky-tests.md.
    - name: Test
      id: test
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/flake"
        set +e
        xvfb-run -a npm test
        echo "exit-code=$?" >> "$GITHUB_OUTPUT"
      env:
        MISSION_TEST_SHARD: ${{ inputs.shard }}/${{ inputs.shard-total }}
        MISSION_TEST_JUNIT: ${{ runner.temp }}/flake/junit.xml

    # The rerun goes through `test:run`, the same script `npm test` runs, with the shard's failed
    # files in place of the glob, so the two runs cannot disagree about how JUnit is produced.
    # `{junit}` is where the rerun writes its results.
    - name: Rerun failed test files once
      uses: ./.github/actions/mission-flake-report
      with:
        mode: rerun
        job: unit (node ${{ inputs.node-version }}, shard ${{ inputs.shard }}/${{ inputs.shard-total }})
        junit: ${{ runner.temp }}/flake/junit.xml
        exit-code: ${{ steps.test.outputs.exit-code }}
        rerun-command: xvfb-run -a env MISSION_TEST_JUNIT={junit} npm run --silent test:run -- {files}
        report: ${{ runner.temp }}/flake/report.json

    # Unique per leg: `upload-artifact@v4` refuses the same name twice in one run. The
    # `flake-report` job collects every `flake-report-*` artifact.
    - name: Upload flake report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: flake-report-unit-node-${{ inputs.node-version }}-shard-${{ inputs.shard }}
        path: ${{ runner.temp }}/flake/report.json
        if-no-files-found: warn
        retention-days: 7
