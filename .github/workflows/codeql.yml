# CodeQL code scanning, advanced setup. Fork-only: upstream has no CodeQL workflow.
#
# Replaces the repository's default setup, which could not exclude paths. Upstream's test code
# arrives in every upstream sync and is reported as new to the fork, so `e2e/` and `test/` are
# excluded through the config file. Default setup must stay disabled in Settings, or GitHub
# rejects this workflow's uploads.
name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "30 3 * * 5"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # The same four languages default setup scanned. `none` needs no build: c-cpp reads
        # native/state-lock without compiling it.
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
