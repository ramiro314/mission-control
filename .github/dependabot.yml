# Dependabot version updates. CI judges every proposal like any other pull request.
#
# Titles use the `chore(deps)` prefix so squash subjects stay parseable by Release Please, which
# `.github/workflows/pull-request-title.yml` enforces on every pull request.
#
# The three agent SDKs are ignored here because `.github/workflows/agent-sdk-update.yml` already
# proposes them together. Two of them vendor the agent CLI, so they move as one reviewed bump.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: "@openai/codex-sdk"
      - dependency-name: "@anthropic-ai/claude-agent-sdk"
      - dependency-name: "@earendil-works/pi-coding-agent"
    # Minor and patch bumps arrive as one pull request; each major arrives on its own.
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    # `/` covers `.github/workflows`; the composite actions live in their own directories.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
