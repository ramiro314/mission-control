<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 615" role="img" aria-label="CI job graph before and after the docs-only gate">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><polygon points="0,0 10,5 0,10"/></marker></defs>
  <text x="20" y="30">Before: every pull request runs everything</text>
  <rect x="20" y="80" width="170" height="44" rx="8"/><text x="38" y="108">dependencies x2</text>
  <rect x="250" y="50" width="150" height="40" rx="8"/><text x="292" y="76">gates</text>
  <rect x="250" y="106" width="150" height="40" rx="8"/><text x="284" y="132">unit x12</text>
  <rect x="250" y="162" width="150" height="40" rx="8"/><text x="285" y="188">e2e x15</text>
  <rect x="460" y="134" width="160" height="40" rx="8"/><text x="487" y="160">flake report</text>
  <path d="M190 96 L250 70" marker-end="url(#a)"/><path d="M190 104 L250 126" marker-end="url(#a)"/><path d="M190 112 L250 180" marker-end="url(#a)"/>
  <path d="M400 126 L460 150" marker-end="url(#a)"/><path d="M400 182 L460 160" marker-end="url(#a)"/>
  <text x="660" y="130" class="small">31 jobs on a PR that only edits docs/</text>

  <text x="20" y="232">After: a changes job gates the heavy jobs; CI result always reports</text>
  <rect class="new" x="20" y="292" width="170" height="44" rx="8"/><text x="70" y="320">changes</text>
  <rect x="20" y="410" width="170" height="44" rx="8"/><text x="38" y="438">dependencies x2</text>
  <rect x="250" y="280" width="150" height="40" rx="8"/><text x="292" y="306">gates</text>
  <rect x="250" y="330" width="150" height="40" rx="8"/><text x="284" y="356">unit x12</text>
  <rect x="250" y="380" width="150" height="40" rx="8"/><text x="285" y="406">e2e x15</text>
  <rect class="new" x="250" y="470" width="150" height="40" rx="8"/><text x="270" y="496">docs checks</text>
  <rect x="460" y="355" width="160" height="40" rx="8"/><text x="487" y="381">flake report</text>
  <rect class="new" x="760" y="360" width="160" height="44" rx="8"/><text x="795" y="388">CI result</text>
  <path d="M190 310 L250 300" marker-end="url(#a)"/><path d="M190 316 L250 348" marker-end="url(#a)"/><path d="M190 322 L250 396" marker-end="url(#a)"/>
  <path d="M190 442 L250 488" marker-end="url(#a)"/>
  <path d="M400 350 L460 370" marker-end="url(#a)"/><path d="M400 400 L460 382" marker-end="url(#a)"/>
  <path d="M105 292 C105 252 820 252 830 360" marker-end="url(#a)"/>
  <path d="M400 300 C620 300 700 340 760 368" marker-end="url(#a)"/>
  <path d="M400 340 C560 312 660 330 760 374" marker-end="url(#a)"/>
  <path d="M620 375 L760 380" marker-end="url(#a)"/>
  <path d="M400 410 C560 444 660 424 760 388" marker-end="url(#a)"/>
  <path d="M400 490 C620 490 700 420 760 396" marker-end="url(#a)"/>
  <path d="M190 448 C200 600 830 600 840 404" marker-end="url(#a)"/>
  <text x="20" y="474" class="small">also feeds gates, unit, e2e</text>
  <text x="250" y="590" class="small">CI result needs every job except package; a skip passes only when changes reported docs_only = true</text>
  <text x="250" y="608" class="small">docs-only PR: gates, unit and e2e skip; flake report still publishes &quot;Flaky tests&quot; for Wait for CI</text>
</svg>
